name: Build OpenWrt IPK for wstunnel (aarch64)

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * *'      # 每天 6 点检查上游
  workflow_dispatch:

permissions:
  contents: write            # 允许自动提交和发布 Release

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      changed: ${{ steps.ver.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Get latest upstream tag
        id: upstream
        run: |
          LATEST=$(curl -sL https://api.github.com/repos/erebe/wstunnel/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Compare with Makefile
        id: ver
        run: |
          CURRENT=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2 | tr -d ' ')
          LATEST='${{ steps.upstream.outputs.latest }}'
          echo "current=$CURRENT latest=$LATEST"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          elif [ "$LATEST" != "$CURRENT" ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$LATEST/" Makefile
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.ver.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "wstunnel: update to ${{ steps.ver.outputs.version }}"
          git push

  build:
    needs: check-version
    # 手动/推送时始终编译；定时触发时只有版本变化才编译
    if: github.event_name != 'schedule' || needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 0

    - name: Clean workspace
      run: |
        # 删除可能引起循环的旧 SDK 目录
        rm -rf sdk

    - name: Download OpenWrt SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/23.05.5/targets/sunxi/cortexa53/openwrt-sdk-23.05.5-sunxi-cortexa53_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
        wget -O sdk.tar.xz $SDK_URL
        mkdir sdk
        tar -xJf sdk.tar.xz -C sdk --strip-components=1    

    - name: Copy package to SDK
      run: |
        # 直接复制，不使用软链接，且不复制 .git 目录
        mkdir -p sdk/package/wstunnel
        # 只复制必要的文件：Makefile 和 files 目录
        cp -r $GITHUB_WORKSPACE/Makefile sdk/package/wstunnel/
        cp -r $GITHUB_WORKSPACE/files sdk/package/wstunnel/ 2>/dev/null || true
        # 如果有 LICENSE 也复制
        cp -r $GITHUB_WORKSPACE/LICENSE sdk/package/wstunnel/ 2>/dev/null || true
        
        echo "=== Package contents ==="
        ls -la sdk/package/wstunnel/

    - name: Update feeds
      run: |
        cd sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build package
      env:
        TERM: linux
      run: |
        cd sdk
        make defconfig
        make package/wstunnel/compile V=99

    - name: Upload IPK artifact
      uses: actions/upload-artifact@v4
      with:
        name: wstunnel-aarch64-${{ needs.check-version.outputs.version }}
        path: sdk/bin/packages/*/*/wstunnel*.ipk
        if-no-files-found: error

  # 新增的发布任务
  release:
    needs: [check-version, build]
    if: |
      always() && 
      needs.build.result == 'success' &&
      (github.event_name != 'schedule' || needs.check-version.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v4
        with:
          name: wstunnel-aarch64-${{ needs.check-version.outputs.version }}
          path: ./ipk-files

      - name: Locate IPK
        id: ipk
        run: |
          IPK=$(find ./ipk-files -name '*.ipk' | head -n 1)
          echo "path=$IPK" >> $GITHUB_OUTPUT
          ls -la "$IPK"

      - name: Create Release and Upload IPK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: "wstunnel for OpenWrt v${{ needs.check-version.outputs.version }}"
          files: ./ipk-files/*.ipk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}